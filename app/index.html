    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://jevaimodel.app/#website",
            "url": "https://jevaimodel.app/",
            "name": "JEV AI Model",
            "description": "JEV AI Model is a free online AI classifier playground for typed, grounded answers."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://jevaimodel.app/#app",
            "name": "JEV AI Model",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web browser",
            "url": "https://jevaimodel.app/",
            "description": "JEV AI Model turns JSON state into typed answers — Noul truth evaluation, Score rubric grading, and Choice multiple-choice — with a confidence value and rationale for every result.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://jevaimodel.app/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is JEV AI Model free to use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The JEV AI Model playground on this page is free to try in your browser. Pick an example, edit the state, and run a classification without creating an account."
                }
              },
              {
                "@type": "Question",
                "name": "What is a JEV AI Model state?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "State is a JSON object that describes the world the model should reason about — a product, a candidate, a conversation, or a prompt. JEV AI Model answers questions strictly against this state, which keeps results grounded and auditable."
                }
              },
              {
                "@type": "Question",
                "name": "What are Noul, Score, and Choice in JEV AI Model?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "They are the three question primitives in JEV AI Model. Noul evaluates how true a proposition is, Score grades a subject against a rubric, and Choice selects the best option from a set you provide."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an API key to try JEV AI Model?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. You can run the JEV AI Model playground directly on this page. Sign in only if you want to keep going after the free trial runs."
                }
              },
              {
                "@type": "Question",
                "name": "What can I classify with JEV AI Model?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Anything you can describe as state: résumés, support transcripts, user prompts, survey responses, product listings, and more. If you can write the facts as JSON and ask a typed question, JEV AI Model can answer it."
                }
              }
            ]
          }
        ]
      }
    </script>
