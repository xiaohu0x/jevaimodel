name = "jev-edge"
main = "index.js"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# Bind the apex + www to this Worker (no DNS changes required).
[[routes]]
pattern = "jevaimodel.app/*"
zone_name = "jevaimodel.app"

[[routes]]
pattern = "www.jevaimodel.app/*"
zone_name = "jevaimodel.app"
